<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 자세 분석 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#f2f4f6; --panel:#ffffff; --sunk:#f7f8fa;
  --ink:#17212b; --ink-2:#55616d; --ink-3:#8a949e;
  --rule:#dde2e7; --rule-2:#c9d0d7;
  --accent:#2b50c8; --accent-ink:#1e3a99; --accent-soft:#e8edfb;
  --pre:#2a78d6; --post:#eb6834;
  --good:#127a3e; --good-soft:#e4f4ea; --warn:#9a6200; --warn-soft:#fdf1d8; --bad:#b83434; --bad-soft:#fbe8e8;
  --ear:#6250d6; --sh:#2a78d6; --hip:#eb6834; --c7:#12a37f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[data-allow-copy]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
canvas,video,img,svg{-webkit-user-drag:none}
body{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid rgba(43,80,200,.45);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.bar{background:var(--paper)}
.bar-in{max-width:1080px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.bar nav{margin-left:auto;display:flex;gap:4px}
.bar nav a{font-size:14px;color:var(--ink-2);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:500}
.bar nav a:hover{color:var(--ink);background:#e7eaee}
.bar nav a.on{color:var(--ink);background:#e2e6eb;font-weight:600}

main{padding:8px 20px 80px}
.view{display:none}.view.on{display:block}
.flow{max-width:660px;margin:0 auto}
.wide{max-width:1080px;margin:0 auto}

/* stepper: real sequence */
.stepper{display:grid;gap:6px;margin:8px 0 26px}
.stepper ol{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.stepper li{font-size:13px;color:var(--ink-3);padding-top:9px;border-top:3px solid var(--rule);font-weight:500}
.stepper li.done{border-color:var(--accent);color:var(--ink-2)}
.stepper li.now{border-color:var(--accent);color:var(--ink);font-weight:600}

/* panels */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:24px}
.panel + .panel{margin-top:14px}
.panel h2{font-size:20px;font-weight:700;margin-bottom:6px}
.panel h3{font-size:16px;font-weight:600;margin-bottom:10px}
.sub{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.muted{color:var(--ink-3)} .small{font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* forms */
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:11px 13px;border:1px solid var(--rule-2);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:84px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;border:1px solid var(--rule-2);background:#fff;cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,border-color .15s;color:var(--ink)}
.btn:hover{background:var(--sunk);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:#ebc3c3}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#e7eaee}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.soft-off{opacity:.5}
.btn.soft-off:hover{opacity:.6}
.actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.actions .btn.primary{min-width:180px}
@media (max-width:520px){.actions{flex-direction:column-reverse;align-items:stretch}.actions .btn{width:100%}}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14.5px;color:var(--ink-2);padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--sunk)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:#eceff2;color:var(--ink-2)} .pill.brand{background:var(--accent-soft);color:var(--accent-ink)}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:#6b4500;font-size:14px}
.notice.info{background:var(--accent-soft);color:var(--accent-ink)}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule-2);border-radius:12px}

/* welcome: fits one screen, no scroll */
body.fit{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.fit main{flex:1;min-height:0;display:flex;padding:0 20px 18px;overflow:hidden}
body.fit #v-start.on{flex:1;display:flex;min-height:0}
body.fit .flow{max-width:1000px;width:100%;margin:auto}
body.fit .foot{display:none}
body.fit.fit-scroll{overflow:auto;height:auto}
body.fit.fit-scroll main{overflow:visible}
input.bad{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)!important}
.check.bad{border-color:var(--bad);background:var(--bad-soft)}
.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.welcome .panel{padding:22px}
@media (max-width:880px){.welcome{grid-template-columns:1fr;gap:16px}.welcome .plumb{display:none}.welcome .intro{grid-template-columns:1fr}}
body.tight .intro h1{font-size:24px}
body.tight .lead{font-size:14.5px;margin-top:8px}
body.tighter .lead{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
body.tight .facts{display:none}
body.tight .team{display:none}
body.tight .facts span{display:none}
body.tight .welcome .panel{padding:16px}
body.tight .welcome .check{padding:10px;font-size:13.5px}
body.tight .welcome .hint{display:none}
body.tighter .facts{display:none}
body.tighter .team{display:none}
/* the plumb line is the one bold element */
.intro{display:grid;grid-template-columns:44px 1fr;gap:22px}
.plumb{position:relative}
.plumb svg{position:absolute;top:-34px;left:0;height:360px;width:44px;overflow:visible}

.plumb .bob{transform-origin:22px 0;animation:sway 3.6s ease-in-out 1 both}
@keyframes sway{0%{transform:rotate(9deg)}35%{transform:rotate(-5deg)}65%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.team{font-size:14px;color:var(--ink-2);margin:0 0 10px;font-weight:500}
.intro h1{font-size:clamp(28px,5.4vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.22}
.lead{font-size:17px;color:var(--ink-2);margin:14px 0 0;max-width:34em}
.facts{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:12px}
.facts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:15px}
.facts svg{margin-top:3px}
.facts b{font-weight:600}
.facts span{color:var(--ink-3);display:block;font-size:14px}

/* survey */
.sv-sec + .sv-sec{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule)}
.sv-sec h3{font-size:17px}
.q{padding:18px 0;border-bottom:1px solid var(--rule)}
.q:last-child{border-bottom:none;padding-bottom:4px}
.q-title{font-weight:600;margin-bottom:12px;display:flex;gap:10px}
.q-title .qn{color:var(--ink-3);font-weight:500;min-width:20px;font-variant-numeric:tabular-nums}
.q-title .opt-tag{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:4px}
.q.err .q-title{color:var(--bad)}
.q-body{padding-left:30px}
@media (max-width:520px){.q-body{padding-left:0}}
.scale{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.scale label{flex:1;min-width:44px;cursor:pointer}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:grid;place-items:center;height:46px;border-radius:10px;border:1px solid var(--rule-2);font-weight:600;background:#fff;transition:background .12s}
.scale input:focus-visible + span{outline:3px solid rgba(43,80,200,.45);outline-offset:2px}
.scale input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--rule-2);border-radius:10px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);width:17px;height:17px}
.num-in{display:flex;align-items:center;gap:10px;max-width:220px}
.q-msg{margin:6px 0 0;font-size:13.5px;color:var(--bad);min-height:0}
.q-msg:empty{display:none}
.q.bad-num input{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.progress-note{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* photo */
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.tips div{background:var(--sunk);border-radius:12px;padding:12px;font-size:13.5px;color:var(--ink-2)}
.tips b{display:block;color:var(--ink);font-size:14px;font-weight:600}
@media (max-width:560px){.tips{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.slots{grid-template-columns:1fr}}
.slot{border:1px solid var(--rule);border-radius:14px;background:#fff;overflow:hidden}
.slot-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.slot-head b{font-size:15px;font-weight:600}
.slot-body{padding:12px}
.drop{border:1.5px dashed var(--rule-2);border-radius:12px;padding:20px 12px;text-align:center;color:var(--ink-2);display:block;background:var(--sunk);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
label.btn{position:relative;cursor:pointer}
label.btn input[type=file]{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
label.btn:focus-within{outline:3px solid rgba(43,80,200,.45);outline-offset:2px}
.pick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pick .btn{min-width:130px}
.drop .t{font-weight:600;color:var(--ink);margin-top:8px}
.canvas-box{position:relative;touch-action:none;user-select:none}
.canvas-box canvas{display:block;width:100%;border-radius:10px;background:#111}
.status{font-size:13px;margin-top:8px;color:var(--ink-2);min-height:20px}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}
.pguide{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.pguide li{display:grid;grid-template-columns:12px auto 1fr;gap:8px;align-items:center}
.pguide i{width:10px;height:10px;border-radius:50%}
.pguide b{font-weight:600;color:var(--ink)}
.pguide span{color:var(--ink-3)}
.legend-dots{display:flex;gap:12px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;margin-top:8px}
.legend-dots i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* result */
.score-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:480px){.score-hero{grid-template-columns:1fr;justify-items:start}}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .n span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.tend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
@media (max-width:480px){.mcards{grid-template-columns:1fr}}
.mcard{border:1px solid var(--rule);border-radius:12px;padding:14px}
.mcard .l{font-size:13.5px;color:var(--ink-2);font-weight:500}
.mcard .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:2px 0}
.mcard .s{font-size:12.5px;color:var(--ink-3)}
.mcard .row{justify-content:space-between}
.cmp td.num,.cmp th.num{text-align:right}
.ex-list{display:grid;gap:10px}
.ex{border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.ex summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.ex summary::-webkit-details-marker{display:none}
.ex summary h4{font-size:15.5px;font-weight:600}
.ex summary .why{font-size:12.5px;color:var(--accent-ink);font-weight:600}
.ex summary .mins{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.ex ol{margin:10px 0 2px;padding-left:20px;font-size:14.5px;color:var(--ink-2)}
.ex ol li + li{margin-top:4px}
.done-mark{width:56px;height:56px;border-radius:50%;background:var(--good-soft);display:grid;place-items:center;margin-bottom:16px}

/* admin */
.ahead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 18px}
.ahead h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.ahead p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.subtabs button{border:none;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px}
.stat .k{font-size:13px;color:var(--ink-2);font-weight:500}
.stat .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.chart-box{position:relative;height:300px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-right:12px}
.key i{width:12px;height:12px;border-radius:3px;display:inline-block}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-weight:500;color:var(--ink-3);font-size:13px;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
.tbl-wrap{overflow-x:auto}
.cb{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.delta-up{color:var(--good);font-weight:600}.delta-down{color:var(--bad);font-weight:600}
.qedit{border:1px solid var(--rule);border-radius:12px;padding:14px;background:var(--sunk);margin-bottom:10px}
.qedit .qnum{font-weight:700;color:var(--accent-ink);font-size:13.5px}
.sv-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.sv-item:last-child{border-bottom:none}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--rule-2);position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{left:19px}
.set-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:8px 10px;align-items:center}
.set-grid .h{font-size:13px;color:var(--ink-3)}
@media (max-width:640px){.set-grid{grid-template-columns:repeat(3,1fr)}.set-grid .h{display:none}.set-grid .lab{grid-column:1/-1;margin-top:10px}}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,32,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:660px;width:100%;padding:24px}
.modal h3{font-size:18px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:80px 0;text-align:center;color:var(--ink-3)}
.foot{max-width:660px;margin:36px auto 0;font-size:12.5px;color:var(--ink-3);text-align:center}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#start" id="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><line x1="11" y1="1" x2="11" y2="14" stroke="var(--ink)" stroke-width="1.6"/><path d="M11 13.5l-4 3.2L11 21l4-4.3z" fill="var(--accent)"/></svg>
      <span id="brandName">AI 자세 분석 설문</span>
    </a>
    <nav id="tabs">
      <a href="#start" data-v="start">설문 참여</a>
      <a href="#admin" data-v="admin">연구자</a>
    </nav>
  </div>
</header>

<main>
  <div class="loading" id="bootLoading">불러오는 중…</div>
  <section class="view" id="v-start"><div class="flow" id="flow"></div></section>
  <section class="view" id="v-admin"><div class="wide" id="adminWrap"></div></section>
  <p class="foot">이 결과는 의료 진단이 아니라 학생 연구용 자세 균형 지표입니다. 스트레칭 중 통증이 있으면 바로 멈추고 전문가와 상담하세요.</p>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================

/* ---- 클릭·제출이 막히는 환경 대비 ----
   미리보기 창처럼 양식 제출이 막힌 곳에서도 모든 '제출' 버튼과 Enter 키가 동작하도록
   실제 제출 대신 submit 이벤트를 직접 발생시킨다. */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || !b.form || (b.getAttribute('type') || 'submit') !== 'submit' || b.disabled) return;
  e.preventDefault();
  b.form.dispatchEvent(new Event('submit', { cancelable:true, bubbles:true }));
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (!t.form || t.tagName !== 'INPUT' || ['checkbox','radio','file','button','submit'].includes(t.type)) return;
  if (t.id === 'wName') return;               // 시작 화면은 자체 처리
  e.preventDefault();
  t.form.dispatchEvent(new Event('submit', { cancelable:true, bubbles:true }));
}, true);
// 조건이 안 맞는 버튼도 눌리게 두고, 누르면 이유를 알려 준다
/* ---- 앱 안의 내용 복사 막기 (입력 칸은 예외) ---- */
const copyAllowed = t => t && t.closest && t.closest('input, textarea, [data-allow-copy]');
['copy','cut'].forEach(ev => document.addEventListener(ev, e => { if (!copyAllowed(e.target)){ e.preventDefault(); toast('이 앱의 내용은 복사할 수 없어요.'); } }, true));
document.addEventListener('contextmenu', e => { if (!copyAllowed(e.target)) e.preventDefault(); }, true);
document.addEventListener('selectstart', e => { if (!copyAllowed(e.target)) e.preventDefault(); }, true);
document.addEventListener('dragstart', e => { if (!copyAllowed(e.target)) e.preventDefault(); }, true);
function softOff(el, off){ if (!el) return; el.classList.toggle('soft-off', !!off); }
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2600); }
function openModal(html){ $('#modal').innerHTML=html; $('#modalBg').classList.add('on'); }
function closeModal(){ $('#modalBg').classList.remove('on'); $('#modal').innerHTML=''; }
$('#modalBg').addEventListener('click', e => { if (e.target.id==='modalBg') closeModal(); });
function askConfirm(msg, okLabel='확인', danger=true){
  return new Promise(res => {
    openModal(`<h3>확인</h3><p style="margin:0 0 18px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cfNo">취소</button><button class="btn ${danger?'danger':'primary'}" id="cfYes">${esc(okLabel)}</button></div>`);
    $('#cfNo').onclick=()=>{closeModal();res(false)}; $('#cfYes').onclick=()=>{closeModal();res(true)};
  });
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('클립보드에 복사했습니다.'); }
  catch(e){ openModal(`<h3>아래 내용을 복사하세요</h3><textarea style="min-height:240px" readonly data-allow-copy>${esc(text)}</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">닫기</button></div>`); const ta=$('#modal textarea'); ta.focus(); ta.select(); }
}

  if (code === 'permission-denied'){ toast(Store.mode === 'firebase' && !Store.fbUid ? '서버에 로그인되지 않았어요. Firebase에서 익명 로그인을 켜 주세요.' : '서버에 저장할 권한이 없어요. Firestore 보안 규칙을 확인하세요.'); }
  else if (code === 'unavailable' && Store.mode === 'firebase'){ toast('서버에 연결할 수 없어요. 인터넷 연결을 확인하세요.'); }
  else if (code === 'invalid_argument'){ Store.canWrite = false; toast('저장 권한이 없습니다. 연구 담당자에게 이 페이지의 참여 권한을 요청하세요.'); }
  else if (code === 'quota_exceeded') toast('저장 공간이 가득 찼습니다. 오래된 기록을 정리해 주세요.');
  else toast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
  throw e;
}

/* ---- Firebase(Firestore + 인증) 연결 ---- */
function makeFbAdapter(fs, db){
  const snapDoc = s => ({ id:s.id, exists:s.exists(), data:() => s.data(), metadata:{ fromCache:s.metadata.fromCache } });
  return {
    collection: col => ({
      doc: id => ({ set: body => fs.setDoc(fs.doc(db, col, id), body), delete: () => fs.deleteDoc(fs.doc(db, col, id)) }),
      onSnapshot: (next, err) => fs.onSnapshot(fs.collection(db, col), s => next({ docs:s.docs.map(snapDoc), metadata:{ fromCache:s.metadata.fromCache } }), err)
    }),
    doc: path => ({ set: body => fs.setDoc(fs.doc(db, path), body), onSnapshot: (next, err) => fs.onSnapshot(fs.doc(db, path), s => next(snapDoc(s)), err) })
  };
}
let recordsUnsub = null;
function subscribeRecords(on){
  if (on && !recordsUnsub){
    recordsUnsub = Store.db.collection('records').onSnapshot(snap => {
      Store.records = snap.docs.map(d => ({...d.data(), id:d.id})); Store.fbDenied = false; onDataChange();
    }, err => {
      recordsUnsub = null; Store.records = [];
      if (err && err.code === 'permission-denied'){ Store.fbDenied = true; toast('이 계정은 연구자로 등록되어 있지 않아요. 보안 규칙의 연구자 이메일을 확인하세요.'); }
      if (current === 'admin') renderAdmin();
    });
  }
  if (!on && recordsUnsub){ recordsUnsub(); recordsUnsub = null; Store.records = []; }
}
async function bootFirebase(cfg){
  const imp = name => import(FIREBASE_SDK + name);
  const [appM, fsM, auM] = await withTimeout(Promise.all([imp('firebase-app.js'), imp('firebase-firestore.js'), imp('firebase-auth.js')]), 15000);
  const app = appM.initializeApp(cfg);
  const fdb = fsM.getFirestore(app), auth = auM.getAuth(app);
  Store.mode = 'firebase'; Store.db = makeFbAdapter(fsM, fdb); Store.fb = { auth, au:auM, projectId: cfg.projectId };
  // 첫 인증 상태: 로그인 안 되어 있으면 익명으로 로그인 (참여자)
  await withTimeout(new Promise(res => {
    const off = auM.onAuthStateChanged(auth, async u => { off(); if (!u){ try { await auM.signInAnonymously(auth); } catch(e){ Store.fbError = '익명 로그인이 꺼져 있어요. Firebase 콘솔 > Authentication에서 ‘익명’을 사용 설정하세요.'; } } res(); });
  }), 15000);
  auM.onAuthStateChanged(auth, u => {
    Store.fbUid = u ? u.uid : null;
    Store.fbEmail = u && !u.isAnonymous ? u.email : '';
    Store.isAdmin = !!(u && !u.isAnonymous);
    subscribeRecords(Store.isAdmin);
    if (Store.ready){ updateNav(); if (current === 'admin') renderAdmin(); }
  });
  let pending = 2, done = false, g1 = false, g2 = false;
  const finish = () => { if (!done){ done = true; clearTimeout(timer); startApp(); } };
  const got = () => { if (--pending <= 0) finish(); };
  const timer = setTimeout(() => { finish(); toast('서버 연결이 느려요. 표시된 내용이 최신이 아닐 수 있어요.'); }, 10000);
  Store.db.collection('surveys').onSnapshot(snap => { Store.surveys = snap.docs.map(d => ({...d.data(), id:d.id})); if (!g1){ g1 = true; got(); } if (done) onDataChange(); },
    err => { Store.fbError = '설문을 읽지 못했어요(' + (err.code||err.message) + '). Firestore 보안 규칙을 확인하세요.'; if (!g1){ g1 = true; got(); } });
  Store.db.doc('app/settings').onSnapshot(snap => { Store.settings = {...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {})}; if (!g2){ g2 = true; got(); } if (done) onDataChange(); },
    () => { if (!g2){ g2 = true; got(); } });
}
const fbReady = () => FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId;
async function boot(){
  if (fbReady()){
    try { await bootFirebase(FIREBASE_CONFIG); return; }
    catch(e){ console.warn('Firebase 연결 실패', e); Store.fbError = 'Firebase에 연결하지 못했어요(' + (e.message||e) + '). 이 기기에 저장하는 방식으로 진행해요.'; Store.mode = 'local'; Store.db = null; }
  }
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function'){
    try { db = await window.claude.use('db'); } catch(e) { db = null; }
    try { user = await window.claude.use('user'); } catch(e) { user = null; }
  }
  if (db){
    Store.mode = 'cloud'; Store.db = db; Store.user = user;
    try { Store.localAdmin = sessionStorage.getItem(LS_KEY+'-admin') === '1'; } catch(e) {}
    try { Store.isAdmin = user ? !!(await user.canEdit()) : false; } catch(e) { Store.isAdmin = false; }
    try { Store.selfId = user ? await user.id() : null; } catch(e) { Store.selfId = null; }
    try { const w = user ? await user.can('data.write') : null; Store.canWrite = (w === false) ? false : true; } catch(e) {}
    let pending = 3, done = false;
    const finish = () => { if (!done){ done = true; clearTimeout(timer); startApp(); } };
    const got = () => { pending--; if (pending <= 0) finish(); };
    const timer = setTimeout(() => { finish(); toast('데이터 연결이 느립니다. 표시된 내용이 최신이 아닐 수 있습니다.'); }, 10000);
    let g1=false,g2=false,g3=false;
    db.collection('surveys').onSnapshot(snap => {
      Store.surveys = snap.docs.map(d => ({...d.data(), id:d.id}));
      if (!g1 && !snap.metadata.fromCache){ g1=true; got(); }
      if (done) onDataChange();
    }, () => { if(!g1){g1=true;got();} });
    db.collection('records').onSnapshot(snap => {
      Store.records = snap.docs.map(d => ({...d.data(), id:d.id}));
      if (!g2 && !snap.metadata.fromCache){ g2=true; got(); }
      if (done) onDataChange();
    }, () => { if(!g2){g2=true;got();} });
    db.doc('app/settings').onSnapshot(snap => {
      Store.settings = {...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {})};
      if (!g3 && !snap.metadata.fromCache){ g3=true; got(); }
      if (done) onDataChange();
    }, () => { if(!g3){g3=true;got();} });
  } else {
    Store.mode = 'local'; Store.loadLocal(); startApp();
  }
}

/* =========================================================
   공통 계산: 자세 지표와 점수
   ========================================================= */
function lineTilt(a, b, w, h){
  // a=사진 왼쪽 점, b=사진 오른쪽 점. 양수: 오른쪽이 아래 → 왼쪽이 높음
  const dx = (b.x - a.x) * w, dy = (b.y - a.y) * h;
  const deg = Math.atan2(dy, Math.abs(dx) || 1e-6) * 180 / Math.PI;
  return { deg: Math.abs(deg), high: Math.abs(deg) < 0.3 ? '수평' : (deg > 0 ? '사진 왼쪽' : '사진 오른쪽') };
}
function computeMetrics(front, side){
  const m = { headTilt:null, shoulderTilt:null, pelvisTilt:null, cva:null, high:{} };
  if (front && front.points){
    const p = front.points, w = front.w, h = front.h;
    const pair = (k1,k2) => { const a=p[k1], b=p[k2]; return a.x <= b.x ? lineTilt(a,b,w,h) : lineTilt(b,a,w,h); };
    const he = pair('earL','earR'), sh = pair('shL','shR'), hp = pair('hipL','hipR');
    m.headTilt = he.deg; m.shoulderTilt = sh.deg; m.pelvisTilt = hp.deg;
    m.high = { head: he.high, shoulder: sh.high, pelvis: hp.high };
  }
  if (side && side.points){
    const e = side.points.ear, s = side.points.c7 || side.points.shoulder, w = side.w, h = side.h;
    const dx = Math.abs(e.x - s.x) * w, dy = (s.y - e.y) * h;
    m.cva = Math.atan2(dy, dx || 1e-6) * 180 / Math.PI;
  }
  return m;
}
function evaluate(m, st = Store.settingsFull){
  const items = [];
  const ded = (v, tol, wgt, max) => Math.min(max, Math.max(0, v - tol) * wgt);
  if (m.headTilt != null) items.push({ key:'head', label:'머리 기울기', value:m.headTilt, unit:'°', std:`${st.headTol}° 이하`, d:ded(m.headTilt, st.headTol, st.headWeight, st.headMax), flag:m.headTilt > st.headTol, note:m.high?.head });
  if (m.shoulderTilt != null) items.push({ key:'shoulder', label:'어깨 좌우 높이 차이', value:m.shoulderTilt, unit:'°', std:`${st.shoulderTol}° 이하`, d:ded(m.shoulderTilt, st.shoulderTol, st.shoulderWeight, st.shoulderMax), flag:m.shoulderTilt > st.shoulderTol, note:m.high?.shoulder });
  if (m.pelvisTilt != null) items.push({ key:'pelvis', label:'골반 좌우 높이 차이', value:m.pelvisTilt, unit:'°', std:`${st.pelvisTol}° 이하`, d:ded(m.pelvisTilt, st.pelvisTol, st.pelvisWeight, st.pelvisMax), flag:m.pelvisTilt > st.pelvisTol, note:m.high?.pelvis });
  if (m.cva != null) items.push({ key:'cva', label:'목 각도 (귀–어깨, CVA)', value:m.cva, unit:'°', std:`${st.cvaThreshold}° 이상`, d:ded(st.cvaThreshold, m.cva, st.cvaWeight, st.cvaMax), flag:m.cva < st.cvaThreshold, note:'' });
  if (!items.length) return null;
  items.forEach(it => {
    if (!it.flag) it.level = 0;
    else if (it.key === 'cva') it.level = it.value < st.cvaSevere ? 2 : 1;
    else { const tol = st[it.key+'Tol']; it.level = it.value > tol*2 ? 2 : 1; }
  });
  const total = items.reduce((a,b)=>a+b.d, 0);
  const score = Math.max(0, Math.round(100 - total));
  const grade = score >= st.gradeGood ? {t:'양호',c:'good'} : score >= st.gradeCaution ? {t:'주의',c:'warn'} : {t:'개선 필요',c:'bad'};
  const tend = [], ex = [];
  const byKey = k => items.find(i => i.key === k);
  if (byKey('cva')?.flag){ tend.push(byKey('cva').level===2 ? '뚜렷한 거북목 자세 경향' : '약한 거북목 자세 경향'); ex.push('chin'); }
  if (byKey('shoulder')?.flag){ tend.push('어깨 불균형 경향'); ex.push('shoulder'); }
  if (byKey('pelvis')?.flag){ tend.push('골반 기울기 경향'); ex.push('hip'); }
  if (byKey('head')?.flag){ tend.push('머리 기울기 경향'); ex.push('neck'); }
  if (tend.length >= 2 || score < st.gradeCaution){ tend.push('전체 자세 불균형 경향'); }
  ex.push('wall');
  return { items, score, grade, tendencies:tend, exercises:[...new Set(ex)], partial: items.length < 4 };
}
function latestMeasure(rec, phase){
  const list = (rec.measures || []).filter(x => x.phase === phase).sort((a,b)=>b.at-a.at);
  return list[0] || null;
}
function scoreOf(meas){ if (!meas) return null; const ev = evaluate(meas.metrics || {}); return ev ? ev.score : null; }
function metricOf(meas, key){
  if (!meas) return null;
  if (key === 'score') return scoreOf(meas);
  const v = (meas.metrics||{})[key]; return (v == null) ? null : v;
}
function pearson(xs, ys){
  const n = xs.length; if (n < 3) return null;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0; for (let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  if (!sxx || !syy) return null; return sxy/Math.sqrt(sxx*syy);
}

function numRange(q){
  const lo = (q.min === '' || q.min == null || !Number.isFinite(+q.min)) ? 0 : +q.min;
  const hi = (q.max === '' || q.max == null || !Number.isFinite(+q.max)) ? 10000 : +q.max;
  return [lo, hi];
}
// 숫자 문항: 범위를 벗어나거나 숫자가 아니면 오류 메시지를 보여 주고 응답으로 받지 않음
function checkNum(box, q){
  const inp = box.querySelector('input'), msgEl = box.querySelector('.q-msg');
  const raw = inp.value.trim(); let msg = '', v = null;
  const [lo, hi] = numRange(q), unit = q.unit || '';
  if (inp.validity && inp.validity.badInput) msg = '숫자만 입력해 주세요.';
  else if (raw !== ''){
    v = Number(raw);
    if (!Number.isFinite(v)) { msg = '숫자만 입력해 주세요.'; v = null; }
    else if (v < lo || v > hi) { msg = `${lo}~${hi}${unit} 사이로 입력해 주세요.`; v = null; }
    else if (!/^-?\d+(\.\d{1,2})?$/.test(raw)) { msg = '소수점은 둘째 자리까지 입력할 수 있어요.'; v = null; }
  }
  if (msgEl) msgEl.textContent = msg;
  box.classList.toggle('bad-num', !!msg);
  return { v, msg };
}
function renderQuestion(sv, q, i, val){
  const key = sv.id + '::' + q.id, nm = 'r-' + key.replace(/[^\w-]/g,'_');
  let body = '';
  if (q.type === 'number'){
    const [lo, hi] = numRange(q);
    body = `<div class="num-in"><input type="number" step="any" min="${lo}" max="${hi}" value="${val ?? ''}" inputmode="decimal" aria-label="${esc(q.text)}"><span class="muted">${esc(q.unit||'')}</span></div><p class="q-msg" aria-live="polite"></p>`;
  } else if (q.type === 'scale'){
    const n = Math.max(2, Math.min(10, num(q.scaleMax,5)));
    body = `<div class="scale" role="radiogroup" aria-label="${esc(q.text)}">${Array.from({length:n},(_,k)=>`<label><input type="radio" name="${nm}" value="${k+1}" ${Number(val)===k+1?'checked':''}><span>${k+1}</span></label>`).join('')}</div>
      ${q.minLabel||q.maxLabel ? `<div class="scale-ends"><span>${esc(q.minLabel||'')}</span><span>${esc(q.maxLabel||'')}</span></div>` : ''}`;
  } else if (q.type === 'choice'){
    body = `<div class="opts">${(q.options||[]).map(o=>`<label class="opt"><input type="radio" name="${nm}" value="${esc(o)}" ${val===o?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
  } else {
    body = `<textarea placeholder="자유롭게 적어 주세요" aria-label="${esc(q.text)}">${esc(val||'')}</textarea>`;
  }
  return `<div class="q" data-q="${esc(key)}"><div class="q-title"><span class="qn">${i}</span><span>${esc(q.text)}${q.required?'':'<span class="opt-tag">(선택)</span>'}</span></div><div class="q-body">${body}</div></div>`;
}

const MP_BASES = ['https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/', 'https://unpkg.com/@mediapipe/pose@0.5.1675469404/'];
let posePromise = null;
function loadPoseFrom(base){
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), 30000);
    const start = async () => {
      try {
        const pose = new window.Pose({ locateFile: f => base + f });
        pose.setOptions({ modelComplexity:1, smoothLandmarks:false, enableSegmentation:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
        let cb = null;
        pose.onResults(r => { if (cb){ const f = cb; cb = null; f(r); } });
        await pose.initialize();
        clearTimeout(timer);
        resolve({ run: (img) => new Promise((ok, ko) => { try { pose.reset(); } catch(e) {} cb = ok; pose.send({ image: img }).catch(ko); setTimeout(()=>{ if (cb===ok){ cb=null; ko(new Error('timeout')); } }, 20000); }) });
      } catch(e){ clearTimeout(timer); reject(e); }
    };
    if (window.Pose) return start();
    const s = document.createElement('script');
    s.src = base + 'pose.js'; s.crossOrigin = 'anonymous';
    s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error('script')); };
    s.onload = start;
    document.head.appendChild(s);

const TV_VER = '0.10.14';

const PL_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task';
let poseEngine = '';   // 'landmarker' | 'legacy'
// 연구자가 직접 넣은 모델 파일은 이 기기의 IndexedDB에 보관
function idb(){ return new Promise((ok, ko) => { try { const r = indexedDB.open('adhl-models', 1); r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); } catch(e){ ko(e); } }); }

async function modelDel(){ try { const db = await idb(); await new Promise(ok => { const t = db.transaction('m','readwrite'); t.objectStore('m').delete('pose'); t.oncomplete = ok; t.onerror = ok; }); } catch(e){} }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,ko) => setTimeout(() => ko(new Error('timeout')), ms))]); }
async function loadLandmarker(){
  const local = await modelGet();
  let last;
  for (const base of TV_BASES){
    try {
      const vision = await withTimeout(import(`${base}/vision_bundle.mjs`), 20000);
      const fileset = await withTimeout(vision.FilesetResolver.forVisionTasks(`${base}/wasm`), 20000);
      const opts = d => ({ baseOptions: local ? { modelAssetBuffer: new Uint8Array(local), delegate:d } : { modelAssetPath: PL_MODEL_URL, delegate:d }, runningMode:'IMAGE', numPoses:1, minPoseDetectionConfidence:0.5, minPosePresenceConfidence:0.5 });
      let lm;
      try { lm = await withTimeout(vision.PoseLandmarker.createFromOptions(fileset, opts('GPU')), 30000); }
      catch(e){ lm = await withTimeout(vision.PoseLandmarker.createFromOptions(fileset, opts('CPU')), 30000); }
      return { run: async img => { const r = lm.detect(img); return { poseLandmarks: r && r.landmarks && r.landmarks[0] ? r.landmarks[0] : null }; } };
    } catch(e){ last = e; }
  }
  throw last || new Error('landmarker');
}
function loadPose(){
  if (posePromise) return posePromise;
  posePromise = (async () => {
    try { const e = await loadLandmarker(); poseEngine = 'landmarker'; return e; } catch(e){ console.warn('Pose Landmarker 실패, 이전 버전으로 전환', e); }
    let last;
    for (const base of MP_BASES){ try { const e = await loadPoseFrom(base); poseEngine = 'legacy'; return e; } catch(e){ last = e; } }
    throw last || new Error('load');
  })();
  posePromise.catch(() => { posePromise = null; });
  return posePromise;
}

// 사진 불러오기: 여러 방법을 차례로 시도 (HEIC·대용량·방향 정보 대응)

async function loadImageFile(k, file){

function mirrorCanvas(c){ const m = document.createElement('canvas'); m.width = c.width; m.height = c.height; const g = m.getContext('2d'); g.translate(c.width,0); g.scale(-1,1); g.drawImage(c,0,0); return m; }
// 한 번의 인식 결과를 사진 기준 좌표로 정리 (mirrored면 x를 되돌림)
function readLandmarks(lm, mirrored){
  const P = i => ({ x: Math.min(1,Math.max(0, mirrored ? 1 - lm[i].x : lm[i].x)), y: Math.min(1,Math.max(0,lm[i].y)), v: lm[i].visibility ?? 0 });

  const sideIdx = (P(7).v + P(11).v + P(23).v) >= (P(8).v + P(12).v + P(24).v) ? [7,11,23] : [8,12,24];

const avgPt = (a, b) => b ? { x:(a.x+b.x)/2, y:(a.y+b.y)/2, v:Math.min(a.v,b.v) } : a;

/* ---- 외부 자세 분석 API (선택) ----

   응답(아래 중 하나):
   1) {"landmarks":[{x,y,visibility}, ... 33개]}  MediaPipe 순서, 0~1 비율 또는 픽셀
   2) {"keypoints":[{"name":"left_ear","x":..,"y":..,"score":..}, ...]}  COCO/MoveNet 이름

const KP_INDEX = { nose:0, left_eye:2, right_eye:5, left_ear:7, right_ear:8, left_shoulder:11, right_shoulder:12, left_hip:23, right_hip:24, left_ankle:27, right_ankle:28 };

function parsePoseResponse(json, w, h){

async function callPoseAPI(canvas, view){

  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(cfg.url, { method:'POST', headers, signal:ctl.signal,
      body: JSON.stringify({ image: canvas.toDataURL('image/jpeg', 0.9).split(',')[1], view, width: canvas.width, height: canvas.height }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    if (!out) throw new Error('응답 형식을 알 수 없어요');
    return out;
  } finally { clearTimeout(t); }

async function runAI(k){
  const slot = A[k]; if (!slot) return;
  const ai = $('#aiStatus');
  setStatus(k, 'AI가 기준점을 찾는 중…');
  let a = null, b = null, direct = null, engine = '', apiNote = '';
  // 1) 외부 API가 설정되어 있으면 먼저 사용
  if (apiConfig().url){
    try { const out = await callPoseAPI(slot.canvas, k); if (A[k] !== slot) return;
      if (out.lm) a = readLandmarks(out.lm, false); else direct = out.points; engine = '연결한 API'; }
    catch(e){ apiNote = `연결한 API를 쓰지 못해(${e.message || e}) 기본 AI로 분석했어요. `; }
  }
  // 2) 기본: MediaPipe Pose Landmarker (원본 + 좌우반전 평균)
  if (!a && !direct){
    if (ai){ ai.textContent = 'AI 준비 중… 처음에는 10~20초 걸릴 수 있어요.'; ai.className = 'status'; }
    try {
      const pose = await loadPose();
      if (ai){ ai.textContent = ''; ai.className = 'status'; }
      const r1 = await pose.run(slot.canvas);
      if (A[k] !== slot) return;
      if (!r1 || !r1.poseLandmarks){ setStatus(k, apiNote + '사람을 찾지 못했어요. 몸 전체가 나오게 다시 찍거나 점을 직접 옮겨 주세요.', 'err'); return; }
      try { const r2 = await pose.run(mirrorCanvas(slot.canvas)); if (r2 && r2.poseLandmarks) b = readLandmarks(r2.poseLandmarks, true); } catch(e) {}
      if (A[k] !== slot) return;
      a = readLandmarks(r1.poseLandmarks, false);
      engine = poseEngine === 'landmarker' ? 'Pose Landmarker' : 'MediaPipe Pose';
    } catch(e){
      if (A[k] !== slot) return;
      if (ai){ ai.textContent = 'AI를 불러오지 못했어요. 점을 직접 옮겨서 측정해 주세요.'; ai.className = 'status err'; }
      setStatus(k, apiNote + '모든 점을 실제 위치로 끌어서 옮겨 주세요. 옮기지 않은 점은 점선 동그라미로 표시돼요.', 'err');
      drawEditor(k); updateResult();
      return;
    }
  }
  const strip = p => ({ x:p.x, y:p.y });
  const warn = [];
  if (direct){
    const want = k === 'front' ? FRONT_KEYS : SIDE_KEYS, pts = {};
    want.forEach(key => pts[key] = direct[key] || slot.points[key]);
    if (k === 'side' && !direct.c7 && direct.ear && direct.shoulder) pts.c7 = estimateC7(direct.ear, direct.shoulder, { x: direct.ear.x + 0.05, y: direct.ear.y }, slot.w, slot.h);
    slot.points = pts;
  } else if (k === 'front'){
    const pts = {}; FRONT_KEYS.forEach(key => pts[key] = strip(avgPt(a.front[key], b && b.front[key])));
    slot.points = pts;
    const al = avgPt(a.ank[0], b && b.ank[0]), ar = avgPt(a.ank[1], b && b.ank[1]);
    if (al.v > 0.6 && ar.v > 0.6){ const t = lineTilt(al, ar, slot.w, slot.h).deg; slot.floorTilt = t; if (t > 3) warn.push(`발목 선이 ${fmt(t)}° 기울어져 있어요. 휴대폰을 수평으로 들고 다시 찍으면 더 정확해요.`); }
    if (Math.min(a.front.earL.v, a.front.earR.v) < 0.5) warn.push('귀가 잘 보이지 않아요. 귀 점이 맞는지 확인해 주세요.');

    const ear = avgPt(a.side.ear, b && b.side.ear), sh = avgPt(a.side.shoulder, b && b.side.shoulder), hip = avgPt(a.side.hip, b && b.side.hip), nose = avgPt(a.nose, b && b.nose);
    slot.points = { ear:strip(ear), c7:estimateC7(ear, sh, nose, slot.w, slot.h), shoulder:strip(sh), hip:strip(hip) };
    warn.push('초록 점(목 뒤 7번 목뼈)은 추정 위치예요. 목 뒤에서 가장 튀어나온 뼈에 맞춰 주세요.');
  }
  slot.method = 'ai'; slot.engine = engine; slot.edited = false;
  drawEditor(k); updateResult();
  setStatus(k, apiNote + (b ? `${engine}가 원본·좌우반전 사진을 분석해 평균 위치를 찾았어요. ` : `${engine}가 위치를 찾았어요. `) + (warn.join(' ') || '어긋난 점은 끌어서 고쳐 주세요.'), warn.length || apiNote ? '' : 'ok');
}

const POINT_GUIDE = {

function mountEditor(k){

  const pos = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, rw:r.width, rh:r.height }; };
  cv.addEventListener('pointerdown', e => {
    const p = pos(e), pts = A[k].points; let best = null, bd = 1e9;
    for (const key in pts){ const dx=(pts[key].x-p.x)*p.rw, dy=(pts[key].y-p.y)*p.rh, d=Math.hypot(dx,dy); if (d<bd){bd=d;best=key;} }

function drawEditor(k, active){
  const slot = A[k], cv = $('#cv-'+k); if (!slot || !cv) return;
  const W = cv.clientWidth || 400, H = W * slot.h / slot.w, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.height = H+'px';
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.drawImage(slot.canvas, 0, 0, W, H);
  g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(0,0,W,H);
  const P = key => ({ x: slot.points[key].x*W, y: slot.points[key].y*H });
  const line = (a,b,color,w=2.5,dash=[]) => { g.save(); g.strokeStyle=color; g.lineWidth=w; g.setLineDash(dash); g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); g.restore(); };
  const label = (txt, x, y) => { g.save(); g.font = '600 12px "IBM Plex Sans KR",sans-serif'; const tw = g.measureText(txt).width; x = Math.max(4, Math.min(W - tw - 16, x)); g.fillStyle='rgba(0,0,0,.7)'; g.beginPath(); g.roundRect ? g.roundRect(x, y-11, tw+12, 20, 6) : g.rect(x, y-11, tw+12, 20); g.fill(); g.fillStyle='#fff'; g.fillText(txt, x+6, y+4); g.restore(); };
  const m = computeMetrics(k==='front'?slot:null, k==='side'?slot:null);
  if (k === 'front'){
    [['earL','earR','--ear',m.headTilt,m.high.head],['shL','shR','--sh',m.shoulderTilt,m.high.shoulder],['hipL','hipR','--hip',m.pelvisTilt,m.high.pelvis]].forEach(([a,b,c,v]) => {
      const pa=P(a), pb=P(b), left = pa.x<=pb.x?pa:pb, right = pa.x<=pb.x?pb:pa;
      line({x:left.x-24,y:left.y},{x:right.x+24,y:left.y},'rgba(255,255,255,.8)',1.2,[5,4]);   // 수평 기준선
      line(pa,pb,cssVar(c),3);
      label(`${fmt(v)}°`, right.x + 12, (pa.y+pb.y)/2);
    });
    // 몸 중심 수직선(참고용)
    const mx = (P('shL').x+P('shR').x)/2, mx2 = (P('hipL').x+P('hipR').x)/2;
    line({x:mx,y:Math.min(P('earL').y,P('earR').y)-10},{x:mx2,y:Math.max(P('hipL').y,P('hipR').y)+10},'rgba(255,255,255,.35)',1,[2,4]);
  } else {
    const e=P('ear'), c=slot.points.c7 ? P('c7') : P('shoulder'), s=P('shoulder'), h=P('hip');
    line(s,h,cssVar('--hip'),2);
    line({x:e.x,y:e.y-30},{x:e.x,y:h.y+20},'rgba(255,255,255,.3)',1,[2,4]);              // 귀 기준 수직선(참고용)
    const dir = e.x >= c.x ? 1 : -1;
    line(c,{x:c.x+dir*Math.max(70,Math.abs(e.x-c.x)+40),y:c.y},'rgba(255,255,255,.85)',1.4,[5,4]); // C7 수평선
    line(c,e,cssVar('--ear'),3);
    g.save(); g.strokeStyle='#fff'; g.lineWidth=1.5; const ang = Math.atan2(e.y-c.y, e.x-c.x); g.beginPath();
    if (dir>0) g.arc(c.x,c.y,30,ang,0); else g.arc(c.x,c.y,30,Math.PI,ang); g.stroke(); g.restore();
    label(`목 각도 ${fmt(m.cva)}°`, c.x + (dir>0 ? 36 : -130), c.y + 18);
  }
  for (const key in slot.points){
    if (!POINT_INFO[key]) continue;
    const p = P(key), col = cssVar(POINT_INFO[key].c), on = key===active;
    if (slot.method === 'manual' && !(slot.touched||{})[key] && !on){ g.save(); g.setLineDash([3,3]); g.strokeStyle='#fff'; g.lineWidth=2; g.beginPath(); g.arc(p.x,p.y,14,0,Math.PI*2); g.stroke(); g.restore(); }
    g.beginPath(); g.arc(p.x,p.y,on?12:8,0,Math.PI*2); g.fillStyle='#fff'; g.fill();
    g.beginPath(); g.arc(p.x,p.y,on?9:5.5,0,Math.PI*2); g.fillStyle=col; g.fill();
  }
  // 확대경: 끌고 있는 점 주변을 3배로
  if (active && slot.points[active]){
    const p = P(active), R0 = 58, Z = 3, src = (R0*2/Z) * slot.w / W;
    const low = p.y < H/2, cx = p.x < W/2 ? W - R0 - 10 : R0 + 10, cy = low ? H - R0 - 10 : R0 + 30;
    const sx = slot.points[active].x*slot.w - src/2, sy = slot.points[active].y*slot.h - src/2;
    g.save(); g.beginPath(); g.arc(cx,cy,R0,0,Math.PI*2); g.closePath(); g.fillStyle='#000'; g.fill(); g.clip();
    g.drawImage(slot.canvas, sx, sy, src, src, cx-R0, cy-R0, R0*2, R0*2);
    g.strokeStyle = cssVar(POINT_INFO[active].c); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(cx-R0,cy); g.lineTo(cx-5,cy); g.moveTo(cx+5,cy); g.lineTo(cx+R0,cy); g.moveTo(cx,cy-R0); g.lineTo(cx,cy-5); g.moveTo(cx,cy+5); g.lineTo(cx,cy+R0); g.stroke();
    g.restore();
    g.beginPath(); g.arc(cx,cy,R0,0,Math.PI*2); g.strokeStyle='#fff'; g.lineWidth=3; g.stroke();
    label(POINT_INFO[active].label, cx - R0, cy - R0 - 14);
  }
  const bd = $('#badge-'+k); if (bd) bd.innerHTML = slot.method==='manual' ? '<span class="pill gray">직접 지정</span>' : `<span class="pill brand">AI 인식${slot.edited?' 후 수정':''}</span>`;
}

        <input type="password" id="fbPw" autocomplete="current-password">

        <button class="btn primary block" style="margin-top:16px">로그인</button>
      </form></div>`;

      finally { btn.disabled = false; } };
    setTimeout(()=>$('#fbEmail') && $('#fbEmail').focus(), 50);
    return;
  }
  if (!Store.admin){
    adminEditing = false;
    el.innerHTML = `<div class="flow" style="max-width:420px"><div class="ahead"><div><h1>연구자 로그인</h1><p>설문 관리와 전체 결과는 연구자만 볼 수 있어요.</p></div></div>
      <form class="panel" id="loginForm">
        <label class="f" for="pinIn">비밀번호</label>
        <input type="password" id="pinIn" autocomplete="current-password" inputmode="numeric">
        <button class="btn primary block" style="margin-top:16px">로그인</button>
      </form></div>`;
    $('#loginForm').onsubmit = async e => { e.preventDefault();
      if (await sha256($('#pinIn').value) === Store.adminHash){ Store.localAdmin = true; try{sessionStorage.setItem(LS_KEY+'-admin','1')}catch(e){} toast('로그인했어요.'); renderAdmin(); }
      else { toast('비밀번호가 맞지 않아요.'); $('#pinIn').select(); } };
    setTimeout(()=>$('#pinIn') && $('#pinIn').focus(), 50);
    return;
  }
  const n = Store.records.length;
  el.innerHTML = `<div class="ahead"><div><h1>연구자 페이지</h1><p>참여자 ${n}명의 응답이 ${Store.mode==='firebase' ? `Firebase 서버(${esc(Store.fb.projectId)})에 저장되고 있어요. ${esc(Store.fbEmail)}로 로그인함` : Store.mode==='cloud' ? '이 페이지에 공유 저장되고 있어요.' : '이 기기에 저장되어 있어요.'}</p></div><span class="spacer"></span>
    <a class="btn sm" href="#start" id="openFlow">참여 화면 열기</a><button class="btn sm" id="logout">로그아웃</button></div>

  <div id="adminBody"></div>`;
  $$('.subtabs button').forEach(b => b.onclick = () => { if (draft){ toast('편집 중인 설문을 먼저 저장하거나 취소하세요.'); return; } adminEditing=false; adminTab = b.dataset.t; renderAdmin(); });
  $('#openFlow').onclick = () => { if (R.step !== 'welcome' && isKiosk()){ R.step = 'welcome'; R.rec = null; } };
  $('#logout').onclick = logout;
  ({dash:adminDash, surveys:adminSurveys, criteria:adminCriteria, data:adminData, settings:adminSettings})[adminTab]();
}
function logout(){
  if (Store.mode === 'firebase'){ draft = null; adminEditing = false; adminTab = 'dash';
    Store.fb.au.signOut(Store.fb.auth).then(() => Store.fb.au.signInAnonymously(Store.fb.auth)).catch(() => {});
    toast('로그아웃했어요.'); return; }
  Store.localAdmin = false; try{ sessionStorage.removeItem(LS_KEY+'-admin'); }catch(e){}
  draft = null; adminEditing = false; adminTab = 'dash'; toast('로그아웃했어요.');
  if (current === 'admin') renderAdmin(); else updateNav();
}
function updateNav(){
  const nav = $('#tabs'); if (!nav) return;
  const out = nav.querySelector('[data-v=logout]');
  if (Store.admin && !out){ const a = document.createElement('a'); a.href = '#start'; a.dataset.v = 'logout'; a.textContent = '로그아웃'; a.onclick = e => { e.preventDefault(); e.stopPropagation(); logout(); goView('start'); }; nav.appendChild(a); }
  if (!Store.admin && out) out.remove();
}

/* ---- 응답 결과 ---- */
const charts = {};
let resMetric = 'score', scatterX = '', scatterY = 'pre';
const METRICS = { score:{l:'자세 점수',u:'점',better:'up'}, cva:{l:'목 각도(CVA)',u:'°',better:'up'}, shoulderTilt:{l:'어깨 높이 차이',u:'°',better:'down'}, pelvisTilt:{l:'골반 높이 차이',u:'°',better:'down'}, headTilt:{l:'머리 기울기',u:'°',better:'down'} };
const DERIVED = { habit:{ group:'습관', label:'자세 습관 점수 (1~5, 높을수록 나쁜 습관)' }, discomfort:{ group:'불편감', label:'신체 불편감 점수 (1~5, 높을수록 불편)' } };
function groupScore(rec, group){
  const vals = [];
  sortedSurveys().forEach(s => (s.questions||[]).forEach(q => {
    if (q.group !== group || q.type !== 'scale') return;
    const a = (rec.surveys||{})[s.id]; const v = a && a.answers ? Number(a.answers[q.id]) : NaN;
    if (Number.isFinite(v)) vals.push(q.reverse ? (num(q.scaleMax,5) + 1 - v) : v);
  }));
  return vals.length ? vals.reduce((x,y)=>x+y,0) / vals.length : null;
}
function numericQuestions(){
  const out = [];
  Object.entries(DERIVED).forEach(([k,d]) => { if (sortedSurveys().some(s => (s.questions||[]).some(q => q.group === d.group))) out.push({ key:'derived|'+k, label:d.label, q:{unit:''} }); });
  sortedSurveys().forEach(s => (s.questions||[]).forEach(q => { if (q.type==='number'||q.type==='scale') out.push({ key:s.id+'|'+q.id, label:`${q.text}${q.unit?` (${q.unit})`:''}`, sv:s, q }); }));
  return out;
}
function answerOf(rec, key){ const [sid,qid] = key.split('|'); if (sid === 'derived'){ const v = groupScore(rec, DERIVED[qid].group); return v == null ? null : Math.round(v*100)/100; } const a = (rec.surveys||{})[sid]; const v = a && a.answers ? a.answers[qid] : null; return (v===null||v===undefined||v==='') ? null : Number(v); }
function adminDash(){
  Object.values(charts).forEach(c => c && c.destroy && c.destroy());
  const recs = sortedRecords();
  const rows = recs.map(r => { const pre = latestMeasure(r,'pre'), post = latestMeasure(r,'post');
    return { r, pre, post, preV: metricOf(pre, resMetric), postV: metricOf(post, resMetric), preS: scoreOf(pre), postS: scoreOf(post) }; });
  const both = rows.filter(x => x.preS!=null && x.postS!=null);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const preL = rows.filter(x=>x.preS!=null), postL = rows.filter(x=>x.postS!=null);
  const avgPre = avg(preL.map(x=>x.preS)), avgPost = avg(postL.map(x=>x.postS)), avgDelta = avg(both.map(x=>x.postS-x.preS));
  const improved = both.filter(x=>x.postS>x.preS).length;
  const surveyed = recs.filter(r => Object.keys(r.surveys||{}).length).length;
  const nq = numericQuestions(); if (!nq.find(q=>q.key===scatterX)) scatterX = nq[0]?.key || '';
  const mt = METRICS[resMetric], dp = resMetric==='score'?0:1;
  const dc = (d, better) => d==null||Math.abs(d)<0.05 ? '' : ((d>0) === (better==='up') ? 'delta-up' : 'delta-down');
  $('#adminBody').innerHTML = `
  <div class="grid g4">
    <div class="stat"><div class="k">참여자</div><div class="v">${recs.length}</div><div class="s">설문 완료 ${surveyed}명</div></div>
    <div class="stat"><div class="k">처음 측정 평균</div><div class="v">${fmt(avgPre)}</div><div class="s">${preL.length}명 측정</div></div>
    <div class="stat"><div class="k">스트레칭 후 평균</div><div class="v">${fmt(avgPost)}</div><div class="s">${postL.length}명 측정</div></div>
    <div class="stat"><div class="k">평균 변화</div><div class="v ${dc(avgDelta,'up')}">${avgDelta==null?'–':(avgDelta>0?'+':'')+fmt(avgDelta)}</div><div class="s">두 번 모두 측정한 ${both.length}명 중 ${improved}명 상승</div></div>
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="row" style="margin-bottom:10px"><h3 style="margin:0">참여자별 처음과 스트레칭 후</h3><span class="spacer"></span>
      <select id="resMetric" style="width:auto" aria-label="비교 지표">${Object.entries(METRICS).map(([k,v])=>`<option value="${k}" ${k===resMetric?'selected':''}>${v.l}</option>`).join('')}</select></div>
    ${rows.some(x=>x.preV!=null||x.postV!=null) ? `<div style="margin-bottom:6px"><span class="key"><i style="background:var(--pre)"></i>처음</span><span class="key"><i style="background:var(--post)"></i>스트레칭 후</span><span class="small muted">${mt.better==='up'?'높을수록 좋음':'낮을수록 균형'}</span></div><div class="chart-box"><canvas id="chBar" role="img" aria-label="참여자별 비교 막대그래프"></canvas></div>`
      : `<div class="empty">아직 측정 결과가 없어요. 참여 화면에서 첫 응답을 받아 보세요.</div>`}
    <div class="tbl-wrap" style="margin-top:14px"><table class="t"><thead><tr><th style="width:34px"><input type="checkbox" id="selAll" aria-label="모두 선택" class="cb"></th><th>참여자</th><th>참여일</th><th class="num">처음</th><th class="num">스트레칭 후</th><th class="num">변화</th><th>등급</th><th>설문</th></tr></thead>
      <tbody>${rows.length ? rows.map(x => { const d = (x.preV!=null&&x.postV!=null) ? x.postV-x.preV : null; const evp = x.post ? evaluate(x.post.metrics||{}) : (x.pre ? evaluate(x.pre.metrics||{}) : null);
        return `<tr class="click" data-rec="${esc(x.r.id)}" tabindex="0"><td><input type="checkbox" class="cb sel" value="${esc(x.r.id)}" aria-label="${esc(x.r.name)} 선택"></td><td><b>${esc(x.r.name)}</b></td><td class="small muted">${x.r.createdAt?fmtDate(x.r.createdAt):'–'}</td><td class="num">${fmt(x.preV,dp)}</td><td class="num">${fmt(x.postV,dp)}</td><td class="num ${dc(d,mt.better)}">${d==null?'–':(d>0?'+':'')+fmt(d,dp)}</td><td>${evp?`<span class="pill ${evp.grade.c}">${evp.grade.t}</span>`:'<span class="muted">–</span>'}</td><td>${Object.keys(x.r.surveys||{}).length?'<span class="pill good">완료</span>':'<span class="pill gray">미응답</span>'}</td></tr>`; }).join('') : `<tr><td colspan="8" class="muted">참여자가 아직 없어요.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn sm danger" id="delSel" disabled>선택한 응답 지우기</button><span class="small muted">행을 누르면 참여자별 기록을 볼 수 있어요.</span><span class="spacer"></span><button class="btn sm" id="copyCsv">CSV 복사</button></div>
  </div>
  <div class="panel">
    <h3>생활습관과 자세 점수의 관계</h3>
    ${nq.length ? `<div class="grid g2" style="margin-bottom:12px">
      <div><label class="f" for="scX">가로축: 설문 문항</label><select id="scX">${nq.map(q=>`<option value="${esc(q.key)}" ${q.key===scatterX?'selected':''}>${esc(q.label)}</option>`).join('')}</select></div>
      <div><label class="f" for="scY">세로축: 자세 점수</label><select id="scY"><option value="pre" ${scatterY==='pre'?'selected':''}>처음 측정</option><option value="post" ${scatterY==='post'?'selected':''}>스트레칭 후</option></select></div></div>
      <div class="chart-box"><canvas id="chScatter" role="img" aria-label="설문 응답과 자세 점수 산점도"></canvas></div><div class="small" id="corrNote" style="margin-top:8px"></div>`
    : `<div class="empty">숫자 입력이나 척도 문항이 있어야 비교할 수 있어요.</div>`}
  </div>
  <div class="panel"><h3>결론을 쓸 때</h3><p class="muted" style="margin:0">짧은 스트레칭 직후의 변화이므로 장기적인 교정 효과로 해석하지 않습니다. “AI 기반 맞춤 스트레칭 직후 자세 지표가 일부 개선되는 경향을 확인하였다” 정도로 제한하고, 한계(참여자 수, 촬영 자세 오차, 장기 효과 미확인)와 후속 연구(더 많은 참여자, 4주 이상 추적)를 함께 적어 주세요.</p></div>`;
  $('#resMetric').onchange = e => { resMetric = e.target.value; adminDash(); };
  const selBoxes = $$('#adminBody .sel'), selAll = $('#selAll'), delSel = $('#delSel');
  const syncSel = () => { const n = selBoxes.filter(b=>b.checked).length; delSel.disabled = !n; delSel.textContent = n ? `선택한 응답 ${n}개 지우기` : '선택한 응답 지우기'; if (selAll) selAll.checked = n && n === selBoxes.length; };

  Chart.defaults.font.family = '"IBM Plex Sans KR", sans-serif'; Chart.defaults.color = cssVar('--ink-2');
  const grid = '#e9ecef';
  const cr = rows.filter(x=>x.preV!=null||x.postV!=null);

    charts.bar = new Chart($('#chBar'), { type:'bar', data:{ labels: cr.map(x=>x.r.name), datasets:[ ds('처음','preV',cssVar('--pre')), ds('스트레칭 후','postV',cssVar('--post')) ] },

        scales:{ x:{ grid:{display:false} }, y:{ beginAtZero:true, max: resMetric==='score'?100:undefined, grid:{color:grid}, border:{display:false}, title:{display:true,text:`${mt.l} (${mt.u})`} } } } });

  if ($('#chScatter') && scatterX){
    const pts = recs.map(r => ({ r, x: answerOf(r, scatterX), y: scoreOf(latestMeasure(r, scatterY)) })).filter(p => p.x!=null && p.y!=null);
    const q = nq.find(q=>q.key===scatterX);
    charts.sc = new Chart($('#chScatter'), { type:'scatter', data:{ datasets:[{ label:'참여자', data: pts.map(p=>({x:p.x,y:p.y,name:p.r.name})), backgroundColor:cssVar('--pre'), borderColor:'#fff', borderWidth:2, pointRadius:7, pointHoverRadius:9 }] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => `${c.raw.name}: ${c.raw.x}${q?.q.unit||''}, ${c.raw.y}점` } } },
        scales:{ x:{ title:{display:true,text:q?.label||''}, grid:{color:grid}, border:{display:false} }, y:{ title:{display:true,text:'자세 점수'}, grid:{color:grid}, border:{display:false}, suggestedMin:40, suggestedMax:100 } } } });
    const r = pearson(pts.map(p=>p.x), pts.map(p=>p.y)), note = $('#corrNote');
    if (!pts.length) note.innerHTML = '<span class="muted">이 문항에 답하고 측정까지 마친 참여자가 아직 없어요.</span>';
    else if (r == null) note.innerHTML = `<span class="muted">${pts.length}명. 상관계수는 3명 이상부터 계산돼요.</span>`;
    else { const s = Math.abs(r)<0.3?'관계가 거의 없음':Math.abs(r)<0.7?(r<0?'약하거나 중간 정도의 음의 관계':'약하거나 중간 정도의 양의 관계'):(r<0?'강한 음의 관계':'강한 양의 관계');
      note.innerHTML = `${pts.length}명, 상관계수 r = <b>${r.toFixed(2)}</b> (${s}). <span class="muted">참여자 수가 적으면 우연일 수 있으니 경향으로만 해석하세요.</span>`; }
  }
}
function buildCsv(){
  const qs = []; sortedSurveys().forEach(s => (s.questions||[]).forEach(q => qs.push({ s, q })));
  const head = ['참여자','참여일','측정시점','측정일시','자세점수','머리기울기(°)','어깨높이차(°)','골반높이차(°)','목각도CVA(°)', ...qs.map(x=>`${x.s.title}:${x.q.text}`)];
  const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [head.map(cell).join(',')];
  sortedRecords().forEach(r => {
    const ans = qs.map(x => { const a=(r.surveys||{})[x.s.id]; return a&&a.answers ? a.answers[x.q.id] : ''; });
    const joined = r.createdAt ? new Date(r.createdAt).toLocaleDateString('ko-KR') : '';
    const ms = [...(r.measures||[])].sort((a,b)=>a.at-b.at);
    if (!ms.length) lines.push([r.name,joined,'','','','','','','',...ans].map(cell).join(','));
    ms.forEach(m => { const mm = m.metrics||{}; lines.push([r.name, joined, m.phase==='post'?'스트레칭 후':'처음', new Date(m.at).toLocaleString('ko-KR'), scoreOf(m), fmt(mm.headTilt), fmt(mm.shoulderTilt), fmt(mm.pelvisTilt), fmt(mm.cva), ...ans].map(cell).join(',')); });
  });
  return lines.join('\n');
}

    <div class="row" style="margin-top:18px"><input type="text" id="mName" value="${esc(r.name)}" style="max-width:220px" aria-label="이름 바꾸기"><button class="btn sm" id="mRename">이름 바꾸기</button><span class="spacer"></span><button class="btn sm danger" id="mDelete">이 응답 지우기</button></div>`);
  $('#mClose').onclick = closeModal;
  $$('#modal [data-del]').forEach(b => b.onclick = async () => {
    const u = clone(r); u.measures = (u.measures||[]).filter(m => m.id !== b.dataset.del);
    try { await Store.saveRecord(u); toast('측정 기록을 삭제했어요.'); closeModal(); } catch(e){}
  });
  $('#mRename').onclick = async () => { const v = $('#mName').value.trim(); if (!v || v===r.name) return; const u = clone(r); u.name = v; try { await Store.saveRecord(u); toast('이름을 바꿨어요.'); closeModal(); } catch(e){} };
  $('#mDelete').onclick = async () => { closeModal(); if (await askConfirm(`${r.name}님의 설문 응답과 측정 기록을 모두 지울까요?`,'지우기')){ await deleteRecords([r.id]); } };

function newQuestion(type='scale'){ return { id: uid('q'), type, text:'', required:true, unit:'', min:'', max:'', scaleMax:5, minLabel:'전혀 아님', maxLabel:'매우 그렇다', options:['선택지 1','선택지 2'] }; }
const QTYPES = { scale:'척도 (1~5 등)', number:'숫자 입력', choice:'객관식 (하나 선택)', text:'서술형' };
function renderSurveyEditor(){

    renderSurveyEditor();

function qEditHtml(q, i, n){
  let extra = '';
  if (q.type==='number') extra = `<div class="grid g3" style="margin-top:10px"><div><label class="f">단위</label><input type="text" data-f="unit" value="${esc(q.unit||'')}" placeholder="예: 시간"></div><div><label class="f">최솟값</label><input type="number" data-f="min" value="${esc(q.min??'')}"></div><div><label class="f">최댓값</label><input type="number" data-f="max" value="${esc(q.max??'')}"></div></div>`;
  if (q.type==='scale') extra = `<div class="grid g3" style="margin-top:10px"><div><label class="f">단계 수</label><input type="number" min="2" max="10" data-f="scaleMax" value="${esc(q.scaleMax??5)}"></div><div><label class="f">낮은 쪽 설명</label><input type="text" data-f="minLabel" value="${esc(q.minLabel||'')}"></div><div><label class="f">높은 쪽 설명</label><input type="text" data-f="maxLabel" value="${esc(q.maxLabel||'')}"></div></div>`;
  if (q.type==='choice') extra = `<div style="margin-top:10px"><label class="f">선택지 (한 줄에 하나씩)</label><textarea data-f="options">${esc((q.options||[]).join('\n'))}</textarea></div>`;
  return `<div class="qedit">
    <div class="row" style="margin-bottom:8px"><span class="qnum">Q${i+1}</span>
      <select data-qa="type" data-i="${i}" style="width:auto">${Object.entries(QTYPES).map(([k,v])=>`<option value="${k}" ${q.type===k?'selected':''}>${v}</option>`).join('')}</select>
      <label class="small row" style="gap:5px;cursor:pointer"><input type="checkbox" data-f="required" ${q.required?'checked':''} style="accent-color:var(--brand)">필수</label>
      <span class="spacer"></span>
      <button class="btn sm ghost" data-qa="up" data-i="${i}" ${i===0?'disabled':''} title="위로">▲</button>
      <button class="btn sm ghost" data-qa="down" data-i="${i}" ${i===n-1?'disabled':''} title="아래로">▼</button>
      <button class="btn sm danger" data-qa="del" data-i="${i}">삭제</button>

      <li><b>기준점.</b> 목 각도는 연구와 같은 방식으로 귀 구슬(tragus)과 목 뒤 7번 목뼈(C7)를 잇는 선과 C7을 지나는 수평선 사이의 각으로 계산해요. AI는 C7을 직접 찾지 못해 어깨 위치에서 추정하므로, 측면 사진에서 초록 점을 실제 C7에 맞추면 연구 값과 가장 가까워져요. 정면은 양쪽 귀, 어깨 끝(견봉), 골반을 이은 선이 수평선과 이루는 각이에요.</li>

  };

}

  </div>

    <div class="row"><button class="btn danger" id="wipeMeasures">자세 측정 기록만 모두 지우기</button><button class="btn danger" id="wipeAll">모든 응답 결과 지우기</button></div>
    <p class="small muted" style="margin:8px 0 0">설문 문항, 판정 기준, 비밀번호는 그대로 남아요.</p></div>`;
  $('#exportJson').onclick = () => copyText(JSON.stringify({ app:'adhl-posture', v:2, surveys:Store.surveys, records:Store.records, settings:{...Store.settingsFull, pinHash:undefined, apiKey:undefined} }, null, 1));
  $('#exportCsv').onclick = () => copyText(buildCsv());
  $('#importBox').onfocus = () => adminEditing = true;
  $('#importJson').onclick = async () => {
    let data; try { data = JSON.parse($('#importBox').value); } catch(e){ toast('JSON 형식이 올바르지 않아요.'); return; }
    if (!data || data.app !== 'adhl-posture'){ toast('이 웹앱의 백업이 아니에요.'); return; }
    if (!(await askConfirm(`설문 ${data.surveys?.length||0}개, 참여자 ${data.records?.length||0}명을 합칩니다. 같은 항목은 백업 내용으로 바뀌어요.`,'합치기',false))) return;
    try { for (const s of (data.surveys||[])) if (s && s.id) await Store.saveSurvey(s);
      for (const r of (data.records||[])) if (r && r.id) await Store.saveRecord(r);
      if (data.settings){ const st = {...data.settings}; delete st.pinHash; await Store.saveSettings({ ...Store.settings, ...st }); }
      adminEditing = false; toast('백업을 합쳤어요.'); adminData(); } catch(e){}
  };
  $('#wipeMeasures').onclick = async () => { if (!(await askConfirm('모든 참여자의 자세 측정 기록을 지울까요? 설문 응답은 남아요.','모두 지우기'))) return; try { for (const r of [...Store.records]){ if ((r.measures||[]).length){ const u=clone(r); u.measures=[]; await Store.saveRecord(u); } } toast('측정 기록을 모두 지웠어요.'); } catch(e){} };
  $('#wipeAll').onclick = async () => { if (!(await askConfirm(`참여자 ${Store.records.length}명의 설문 응답과 측정 기록을 모두 지울까요?`,'모두 지우기'))) return; await deleteRecords(Store.records.map(r=>r.id)); };
}
async function deleteRecords(ids){
  let done = 0;
  try { for (const id of ids){ await Store.deleteRecord(id); done++; } toast(`응답 ${done}개를 지웠어요.`); } catch(e){}
  if (Store.mode === 'cloud'){ Store.records = Store.records.filter(r => !ids.includes(r.id)); }
  if (current === 'admin' && !adminEditing) renderAdmin();
}

    const c = document.createElement('canvas'); c.width = 64; c.height = 96; const g = c.getContext('2d'); g.fillStyle = '#ccc'; g.fillRect(0,0,64,96);
    try { await callPoseAPI(c, 'front'); out.textContent = '연결됐어요. 응답 형식도 맞아요.'; out.className = 'small delta-up'; }
    catch(e){ out.textContent = /형식/.test(e.message||'') ? '연결은 됐지만 응답 형식을 알 수 없어요. 아래 형식을 확인하세요.' : `연결하지 못했어요 (${e.message || e}). 주소, 키, CORS 허용을 확인하세요.`; out.className = 'small delta-down'; }
    finally { Store.settings = prev; }
  };
  ['pwOld','pwNew','pwNew2'].forEach(id => $('#'+id).addEventListener('focus', () => adminEditing = true));
  $('#pwForm').onsubmit = async e => {
    e.preventDefault();
    const o = $('#pwOld').value, n1 = $('#pwNew').value, n2 = $('#pwNew2').value;
    if (Store.mode === 'firebase'){
      if (n1.length < 6){ toast('Firebase 비밀번호는 6자 이상이어야 해요.'); return; }
      if (n1 !== n2){ toast('새 비밀번호 확인이 일치하지 않아요.'); return; }
      try { const au = Store.fb.au, u = Store.fb.auth.currentUser;
        await au.reauthenticateWithCredential(u, au.EmailAuthProvider.credential(u.email, o));
        await au.updatePassword(u, n1); adminEditing = false; toast('비밀번호를 바꿨어요.'); adminSettings(); }
      catch(err){ toast(/credential|wrong|invalid/.test(err.code||'') ? '현재 비밀번호가 맞지 않아요.' : '바꾸지 못했어요 (' + (err.code||err.message) + ')'); }
      return;
    }
    if (await sha256(o) !== Store.adminHash){ toast('현재 비밀번호가 맞지 않아요.'); $('#pwOld').select(); return; }
    if (n1.length < 4){ toast('새 비밀번호는 4자 이상이어야 해요.'); $('#pwNew').focus(); return; }
    if (n1 !== n2){ toast('새 비밀번호 확인이 일치하지 않아요.'); $('#pwNew2').select(); return; }
    const h = await sha256(n1);
    if (!h){ toast('이 브라우저에서는 비밀번호를 바꿀 수 없어요.'); return; }
    try {
      if (Store.mode === 'cloud') await Store.saveSettings({ ...Store.settings, pinHash: h });
      else { Store.pinHash = h; Store.persistLocal(); }
      adminEditing = false; toast('비밀번호를 바꿨어요.'); adminSettings();
    } catch(e){}
  };
  $('#aiCheck').onclick = async () => {
    const out = $('#aiCheckOut'); out.textContent = '확인 중… (최대 1분)'; out.className = 'small muted';
    try { await loadPose(); out.textContent = poseEngine === 'landmarker' ? 'Pose Landmarker가 정상 작동해요.' : '이전 버전 MediaPipe Pose로 작동해요. 모델 파일을 직접 넣으면 Pose Landmarker를 쓸 수 있어요.'; out.className = 'small ' + (poseEngine === 'landmarker' ? 'delta-up' : 'muted'); }
    catch(e){ out.textContent = 'AI 모델을 불러오지 못했어요. 아래 방법으로 모델 파일을 직접 넣어 보세요. 그동안은 점을 직접 맞추는 방식으로 진행돼요.'; out.className = 'small delta-down'; }
  };
  const showModel = async () => { const m = await modelGet(); $('#modelState').textContent = m ? `저장된 모델 있음 (${(m.byteLength/1048576).toFixed(1)}MB)` : '저장된 모델 없음'; };
  showModel();
  $('#modelFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size < 1e6 || !/\.task$/i.test(f.name)){ toast('pose_landmarker_full.task 파일을 골라 주세요.'); return; }
    try { await modelPut(await f.arrayBuffer()); posePromise = null; poseEngine = ''; toast('모델 파일을 저장했어요. 연결 확인을 눌러 보세요.'); showModel(); }
    catch(err){ toast('이 브라우저에는 모델 파일을 저장할 수 없어요.'); }
  };
  $('#modelDel').onclick = async () => { await modelDel(); posePromise = null; poseEngine = ''; toast('저장된 모델을 지웠어요.'); showModel(); };
}

boot();
</script>
</body>
</html>
